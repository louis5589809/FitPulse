<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitPulse - Personal Fitness & Workout Tracker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ==========================================================================
           1. CSS VARIABLES & THEME SETUP
           ========================================================================== */
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --border-radius: 12px;
            --transition-speed: 0.3s ease;
            --box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        /* Light Theme Support */
        body.light-theme {
            --bg-primary: #f1f5f9;
            --bg-secondary: #ffffff;
            --bg-card: #e2e8f0;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #0284c7;
            --accent-hover: #0369a1;
            --box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
        }

        /* ==========================================================================
           2. GLOBAL STYLES & RESET
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color var(--transition-speed);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            cursor: pointer;
            border: none;
            outline: none;
            font-family: inherit;
            transition: all var(--transition-speed);
        }

        input, select, textarea {
            font-family: inherit;
            outline: none;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ==========================================================================
           3. HEADER & NAVIGATION
           ========================================================================== */
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--box-shadow);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .nav-links {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .nav-btn {
            background: transparent;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: var(--border-radius);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--text-main);
            background-color: var(--bg-card);
        }

        .theme-toggle {
            background: var(--bg-card);
            color: var(--text-main);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        /* ==========================================================================
           4. MAIN CONTENT VIEWS
           ========================================================================== */
        .view-section {
            display: none;
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           5. DASHBOARD STATS SECTION
           ========================================================================== */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            align-items: center;
            gap: 20px;
            border-left: 4px solid var(--accent-color);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-info h4 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info p {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* ==========================================================================
           6. BODY PARTS & EXERCISES EXPLORER
           ========================================================================== */
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .body-parts-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background-color: var(--bg-secondary);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 20px;
            white-space: nowrap;
            font-weight: 600;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .exercise-card {
            background-color: var(--bg-secondary);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--box-shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .exercise-card:hover {
            transform: translateY(-5px);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .exercise-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .badge {
            background-color: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .exercise-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .exercise-instructions {
            font-size: 0.85rem;
            background-color: var(--bg-primary);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .btn-action {
            background-color: var(--accent-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            width: 100%;
        }

        .btn-action:hover {
            background-color: var(--accent-hover);
        }

        /* ==========================================================================
           7. WORKOUT LOG & FORM SECTION
           ========================================================================== */
        .workout-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        @media (max-width: 850px) {
            .workout-container {
                grid-template-columns: 1fr;
            }
        }

        .form-card {
            background-color: var(--bg-secondary);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            height: fit-content;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .logs-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .log-item {
            background-color: var(--bg-secondary);
            padding: 18px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-info h5 {
            font-size: 1.1rem;
            margin-bottom: 4px;
        }

        .log-details {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            gap: 15px;
        }

        .delete-btn {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger-color);
            padding: 8px 12px;
            border-radius: 6px;
        }

        .delete-btn:hover {
            background-color: var(--danger-color);
            color: white;
        }

        /* ==========================================================================
           8. UTILITIES & TIMER
           ========================================================================== */
        .timer-card {
            background-color: var(--bg-secondary);
            padding: 25px;
            border-radius: var(--border-radius);
            text-align: center;
            box-shadow: var(--box-shadow);
            margin-bottom: 30px;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent-color);
            font-family: monospace;
            margin: 15px 0;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .btn-secondary {
            background-color: var(--bg-card);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
        }

        /* Empty state styling */
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        /* Footer */
        footer {
            margin-top: auto;
            background-color: var(--bg-secondary);
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <!-- NAVBAR HEADER -->
    <header>
        <div class="navbar">
            <div class="logo">
                <i class="fa-solid fa-dumbbell"></i>
                <span>FitPulse</span>
            </div>
            <ul class="nav-links">
                <li><button class="nav-btn active" onclick="switchView('dashboard')"><i class="fa-solid fa-chart-line"></i> Dashboard</button></li>
                <li><button class="nav-btn" onclick="switchView('exercises')"><i class="fa-solid fa-child"></i> Exercises</button></li>
                <li><button class="nav-btn" onclick="switchView('tracker')"><i class="fa-solid fa-pen-to-square"></i> Log Workout</button></li>
            </ul>
            <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        </div>
    </header>

    <!-- MAIN CONTAINER AREA -->
    <main class="container">

        <!-- ===================================================================
             VIEW 1: DASHBOARD
             =================================================================== -->
        <section id="dashboard" class="view-section active">
            <h2 class="section-title"><i class="fa-solid fa-house"></i> Workout Overview</h2>
            
            <div class="dashboard-grid">
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-fire"></i></div>
                    <div class="stat-info">
                        <h4>Total Workouts</h4>
                        <p id="statTotalWorkouts">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-weight-hanging"></i></div>
                    <div class="stat-info">
                        <h4>Total Volume (kg)</h4>
                        <p id="statTotalVolume">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon"><i class="fa-solid fa-calendar-check"></i></div>
                    <div class="stat-info">
                        <h4>Active Days</h4>
                        <p id="statActiveDays">0</p>
                    </div>
                </div>
            </div>

            <!-- REST TIMER WIDGET -->
            <div class="timer-card">
                <h3><i class="fa-solid fa-stopwatch"></i> Rest Timer</h3>
                <div class="timer-display" id="timerDisplay">01:00</div>
                <div class="timer-controls">
                    <button class="btn-secondary" onclick="setTimer(30)">30s</button>
                    <button class="btn-secondary" onclick="setTimer(60)">60s</button>
                    <button class="btn-secondary" onclick="setTimer(90)">90s</button>
                    <button class="btn-action" style="width: auto; padding: 10px 25px;" onclick="startTimer()"><i class="fa-solid fa-play"></i> Start</button>
                    <button class="btn-secondary" onclick="resetTimer()"><i class="fa-solid fa-rotate-right"></i> Reset</button>
                </div>
            </div>

            <!-- RECENT ACTIVITIES LIST -->
            <h3 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Recent Activity</h3>
            <div id="recentLogsList" class="logs-list">
                <!-- JS Populated Dynamic Content -->
            </div>
        </section>

        <!-- ===================================================================
             VIEW 2: BODY PARTS & EXERCISES LIBRARY
             =================================================================== -->
        <section id="exercises" class="view-section">
            <h2 class="section-title"><i class="fa-solid fa-bullseye"></i> Targeted Body Part Workouts</h2>
            
            <div class="body-parts-tabs">
                <button class="tab-btn active" onclick="filterExercises('all')">All Muscles</button>
                <button class="tab-btn" onclick="filterExercises('chest')">Chest</button>
                <button class="tab-btn" onclick="filterExercises('back')">Back</button>
                <button class="tab-btn" onclick="filterExercises('legs')">Legs</button>
                <button class="tab-btn" onclick="filterExercises('shoulders')">Shoulders</button>
                <button class="tab-btn" onclick="filterExercises('arms')">Arms</button>
                <button class="tab-btn" onclick="filterExercises('core')">Core</button>
            </div>

            <div id="exerciseGrid" class="exercise-grid">
                <!-- Dynamic Exercise Cards populated via JavaScript -->
            </div>
        </section>

        <!-- ===================================================================
             VIEW 3: WORKOUT LOGGING TRACKER
             =================================================================== -->
        <section id="tracker" class="view-section">
            <h2 class="section-title"><i class="fa-solid fa-pen-to-square"></i> Log Exercise Session</h2>

            <div class="workout-container">
                <!-- FORM -->
                <div class="form-card">
                    <form id="workoutForm" onsubmit="handleFormSubmit(event)">
                        <div class="form-group">
                            <label for="exerciseName">Exercise Name</label>
                            <input type="text" id="exerciseName" class="form-control" placeholder="e.g. Bench Press" required>
                        </div>
                        <div class="form-group">
                            <label for="bodyPartSelect">Target Body Part</label>
                            <select id="bodyPartSelect" class="form-control" required>
                                <option value="chest">Chest</option>
                                <option value="back">Back</option>
                                <option value="legs">Legs</option>
                                <option value="shoulders">Shoulders</option>
                                <option value="arms">Arms</option>
                                <option value="core">Core</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <div class="form-group" style="flex: 1;">
                                <label for="setsInput">Sets</label>
                                <input type="number" id="setsInput" class="form-control" min="1" placeholder="3" required>
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label for="repsInput">Reps</label>
                                <input type="number" id="repsInput" class="form-control" min="1" placeholder="10" required>
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label for="weightInput">Weight (kg)</label>
                                <input type="number" id="weightInput" class="form-control" min="0" step="0.5" placeholder="50" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="workoutDate">Date</label>
                            <input type="date" id="workoutDate" class="form-control" required>
                        </div>
                        <button type="submit" class="btn-action" style="margin-top: 10px;"><i class="fa-solid fa-plus"></i> Save Workout</button>
                    </form>
                </div>

                <!-- DETAILED LOG HISTORY TABLE -->
                <div>
                    <h3 style="margin-bottom: 15px;"><i class="fa-solid fa-list-check"></i> Complete History Log</h3>
                    <div id="fullLogsList" class="logs-list">
                        <!-- Dynamic Content Inserted Here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>FitPulse Tracker App - Hosted on GitHub Pages | Static Local-Storage Enabled</p>
    </footer>

    <!-- JavaScript LOGIC & EMBEDDED APPLICATION STATE -->
    <script>
        /* ==========================================================================
           EXERCISE DATABASE (Body Part Specific Exercises)
           ========================================================================== */
        const exerciseDatabase = [
            { id: 1, name: "Barbell Bench Press", category: "chest", difficulty: "Intermediate", desc: "Build overall chest density and upper body pressing power.", instructions: "Lie flat on bench, unrack weight, lower bar slowly to mid-chest, push explosively back up." },
            { id: 2, name: "Incline Dumbbell Press", category: "chest", difficulty: "Beginner", desc: "Targets upper chest muscles and shoulders.", instructions: "Set bench angle to 30-45 degrees. Press dumbbells overhead, keep elbows slightly tucked." },
            { id: 3, name: "Push-ups", category: "chest", difficulty: "Beginner", desc: "Bodyweight compound movement for chest, shoulders, and core.", instructions: "Maintain plank body line, touch chest to floor, keep core tight throughout motion." },
            
            { id: 4, name: "Lat Pulldown", category: "back", difficulty: "Beginner", desc: "Target latissimus dorsi to widen upper back.", instructions: "Grip wide bar, pull down toward upper chest while driving elbows down." },
            { id: 5, name: "Bent-Over Barbell Row", category: "back", difficulty: "Intermediate", desc: "Build back thickness, traps, and lats.", instructions: "Hinge forward at hips, pull barbell to lower ribcage, squeeze shoulder blades together." },
            { id: 6, name: "Pull-ups", category: "back", difficulty: "Advanced", desc: "Ultimate upper body pulling strength test.", instructions: "Overhand grip wider than shoulders, pull chest to bar without using momentum." },

            { id: 7, name: "Barbell Squats", category: "legs", difficulty: "Intermediate", desc: "King of lower body exercises for quads and glutes.", instructions: "Bar rested across upper back, bend knees and hips down past parallel, drive up through heels." },
            { id: 8, name: "Romanian Deadlift", category: "legs", difficulty: "Intermediate", desc: "Focuses on hamstring and glute development.", instructions: "Keep back flat, hinge hips backwards, lower weight until hamstring stretch is felt." },
            { id: 9, name: "Leg Press", category: "legs", difficulty: "Beginner", desc: "Isolated quad and glute strength builder.", instructions: "Place feet shoulder-width on sled, lower platform until knees are at 90 degrees, press up." },

            { id: 10, name: "Overhead Barbell Press", category: "shoulders", difficulty: "Intermediate", desc: "Develop heavy shoulder pushing power.", instructions: "Stand shoulder-width apart, press barbell strictly from upper chest to full lockout overhead." },
            { id: 11, name: "Dumbbell Lateral Raises", category: "shoulders", difficulty: "Beginner", desc: "Build lateral deltoids for wide shoulder silhouette.", instructions: "Slight bend in elbows, raise dumbbells out to sides until parallel to floor." },

            { id: 12, name: "Barbell Bicep Curls", category: "arms", difficulty: "Beginner", desc: "Classic arm builder isolating biceps.", instructions: "Keep elbows fixed against ribs, curl barbell upward squeeze top contraction." },
            { id: 13, name: "Tricep Rope Pushdown", category: "arms", difficulty: "Beginner", desc: "Target tricep lateral and medial heads.", instructions: "Anchor elbows to sides, press rope down and spread hands apart at extension bottom." },

            { id: 14, name: "Hanging Leg Raises", category: "core", difficulty: "Intermediate", desc: "Targets lower abdominal wall and hip flexors.", instructions: "Hang from pullup bar, lift legs upward without swinging torso until parallel to floor." },
            { id: 15, name: "Plank Hold", category: "core", difficulty: "Beginner", desc: "Isometric core stabilization drill.", instructions: "Hold push-up or forearm position, contract abs, keep hips elevated aligned with shoulders." }
        ];

        /* ==========================================================================
           APPLICATION STATE & LOCAL STORAGE INITIALIZATION
           ========================================================================== */
        let appState = {
            logs: JSON.parse(localStorage.getItem('fitpulse_logs')) || [],
            timerInterval: null,
            timerSeconds: 60,
            timerRemaining: 60
        };

        // Initialize application on DOM ready
        document.addEventListener("DOMContentLoaded", () => {
            // Set default date input to today
            document.getElementById('workoutDate').value = new Date().toISOString().split('T')[0];
            
            // Initial Render Cycles
            renderExercises('all');
            renderLogs();
            updateDashboardStats();
        });

        /* ==========================================================================
           NAVIGATION VIEW CONTROLLER
           ========================================================================== */
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(viewId).classList.add('active');
            
            // Highlight clicked navigation button
            const activeIndex = ['dashboard', 'exercises', 'tracker'].indexOf(viewId);
            if (activeIndex >= 0) {
                document.querySelectorAll('.nav-btn')[activeIndex].classList.add('active');
            }
        }

        /* ==========================================================================
           THEME TOGGLER
           ========================================================================== */
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const icon = document.querySelector('#themeToggleBtn i');
            if (document.body.classList.contains('light-theme')) {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        }

        /* ==========================================================================
           EXERCISE EXPLORER & FILTERING
           ========================================================================== */
        function filterExercises(category) {
            // Update active state on tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(category) || (category === 'all' && btn.textContent === 'All Muscles')) {
                    btn.classList.add('active');
                }
            });

            renderExercises(category);
        }

        function renderExercises(category) {
            const grid = document.getElementById('exerciseGrid');
            grid.innerHTML = '';

            const filtered = category === 'all' 
                ? exerciseDatabase 
                : exerciseDatabase.filter(e => e.category === category);

            filtered.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card';
                card.innerHTML = `
                    <div>
                        <div class="exercise-header">
                            <span class="exercise-title">${ex.name}</span>
                            <span class="badge">${ex.category}</span>
                        </div>
                        <p class="exercise-desc">${ex.desc}</p>
                        <div class="exercise-instructions">
                            <strong><i class="fa-solid fa-circle-info"></i> How to perform:</strong> ${ex.instructions}
                        </div>
                    </div>
                    <button class="btn-action" onclick="quickSelectExercise('${ex.name}', '${ex.category}')">
                        <i class="fa-solid fa-plus"></i> Quick Log Exercise
                    </button>
                `;
                grid.appendChild(card);
            });
        }

        function quickSelectExercise(name, category) {
            switchView('tracker');
            document.getElementById('exerciseName').value = name;
            document.getElementById('bodyPartSelect').value = category;
        }

        /* ==========================================================================
           WORKOUT LOGGING ENGINE
           ========================================================================== */
        function handleFormSubmit(event) {
            event.preventDefault();

            const name = document.getElementById('exerciseName').value;
            const category = document.getElementById('bodyPartSelect').value;
            const sets = parseInt(document.getElementById('setsInput').value);
            const reps = parseInt(document.getElementById('repsInput').value);
            const weight = parseFloat(document.getElementById('weightInput').value);
            const date = document.getElementById('workoutDate').value;

            const newLog = {
                id: Date.now(),
                name,
                category,
                sets,
                reps,
                weight,
                date
            };

            appState.logs.unshift(newLog);
            saveLogsToLocalStorage();

            // Reset Form Inputs
            document.getElementById('workoutForm').reset();
            document.getElementById('workoutDate').value = new Date().toISOString().split('T')[0];

            // Update UI Interface
            renderLogs();
            updateDashboardStats();
            alert('Workout log saved successfully!');
        }

        function deleteLog(id) {
            if(confirm('Are you sure you want to delete this workout entry?')) {
                appState.logs = appState.logs.filter(log => log.id !== id);
                saveLogsToLocalStorage();
                renderLogs();
                updateDashboardStats();
            }
        }

        function saveLogsToLocalStorage() {
            localStorage.setItem('fitpulse_logs', JSON.stringify(appState.logs));
        }

        function renderLogs() {
            const recentContainer = document.getElementById('recentLogsList');
            const fullContainer = document.getElementById('fullLogsList');

            recentContainer.innerHTML = '';
            fullContainer.innerHTML = '';

            if (appState.logs.length === 0) {
                const emptyHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <p>No workouts recorded yet. Start logging today!</p>
                    </div>
                `;
                recentContainer.innerHTML = emptyHTML;
                fullContainer.innerHTML = emptyHTML;
                return;
            }

            // Render Recent 3 items to Dashboard
            appState.logs.slice(0, 3).forEach(log => {
                recentContainer.appendChild(createLogElement(log));
            });

            // Render All items to Full History List
            appState.logs.forEach(log => {
                fullContainer.appendChild(createLogElement(log));
            });
        }

        function createLogElement(log) {
            const item = document.createElement('div');
            item.className = 'log-item';
            item.innerHTML = `
                <div class="log-info">
                    <h5>${log.name} <span class="badge">${log.category}</span></h5>
                    <div class="log-details">
                        <span><i class="fa-solid fa-layer-group"></i> ${log.sets} sets x ${log.reps} reps</span>
                        <span><i class="fa-solid fa-weight-hanging"></i> ${log.weight} kg</span>
                        <span><i class="fa-solid fa-calendar"></i> ${log.date}</span>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteLog(${log.id})"><i class="fa-solid fa-trash"></i></button>
            `;
            return item;
        }

        /* ==========================================================================
           DASHBOARD METRICS CALCULATOR
           ========================================================================== */
        function updateDashboardStats() {
            const totalWorkouts = appState.logs.length;
            const totalVolume = appState.logs.reduce((sum, log) => sum + (log.sets * log.reps * log.weight), 0);
            
            // Find unique dates logged
            const uniqueDates = new Set(appState.logs.map(log => log.date)).size;

            document.getElementById('statTotalWorkouts').innerText = totalWorkouts;
            document.getElementById('statTotalVolume').innerText = totalVolume.toLocaleString();
            document.getElementById('statActiveDays').innerText = uniqueDates;
        }

        /* ==========================================================================
           REST TIMER LOGIC
           ========================================================================== */
        function setTimer(seconds) {
            clearInterval(appState.timerInterval);
            appState.timerSeconds = seconds;
            appState.timerRemaining = seconds;
            updateTimerDisplay();
        }

        function startTimer() {
            clearInterval(appState.timerInterval);
            appState.timerInterval = setInterval(() => {
                if (appState.timerRemaining > 0) {
                    appState.timerRemaining--;
                    updateTimerDisplay();
                } else {
                    clearInterval(appState.timerInterval);
                    alert('Rest period finished! Time for your next set.');
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(appState.timerInterval);
            appState.timerRemaining = appState.timerSeconds;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(appState.timerRemaining / 60);
            const secs = appState.timerRemaining % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
